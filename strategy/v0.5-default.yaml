# Boros v0.5 default strategy YAML -- parses into python/src/boros_brain/config/schema.py::BotConfig
# Placeholder wallet fields are "TBD"; operator supplies per-run overrides.
# `voluntary_cancel_forfeits_accumulated: false` is locked by D-01 / P0-01 resolution.

mode: paper
strategy_version: v0.5.0
market_id: TBD
side: long
root_wallet_address: "0xaF3128a55fb3a1023369998B0f86490fF685e27B"
agent_wallet_address: "0xcaeC51f15AD46466C95e463C89c4782bEEC7c8A4"

strategy:
  voluntary_cancel_forfeits_accumulated: false
  target_share: 0.05

execution:
  cancel_latency_budget_s: 5.0
  require_success_default: true
  agent_wallet_gas_warn_multiples: 50
  agent_wallet_gas_halt_multiples: 20
  agent_wallet_gas_emergency_multiples: 5

data:
  markets_poll_interval_s: 30.0
  e_liq_poll_interval_s: 5.0
  chain_time_cache_ttl_s: 1.0
  rpc_url_arbitrum: "https://arb1.arbitrum.io/rpc"
  boros_rest_base: "https://api.boros.finance/open-api/v1"

infra:
  sqlite_path: "state/state.sqlite"
  logs_dir: "logs"
  zmq_cmd_endpoint: "ipc:///tmp/boros.cmd"
  zmq_events_brain_endpoint: "ipc:///tmp/boros.events.brain"
  zmq_events_hands_endpoint: "ipc:///tmp/boros.events.hands"
  zmq_kill_endpoint: "ipc:///tmp/boros.cmd.kill"
  heartbeat_interval_s: 5.0
  heartbeat_timeout_misses: 3
  chain_drift_warn_s: 5.0
  chain_drift_halt_s: 30.0

screener:
  min_time_to_maturity_days: 30
  trades_window_days: 60
  realized_vol_window_days: 14
  reversal_count_window_days: 3
  # alt_yield: baseline APR that R_apr_on_collateral MUST beat in the DATA-09 economics gate.
  # Default = Aave USDC Arbitrum p50 proxy as of 2026-04 (see [[Economics kill-switch v0.5]]).
  # Unit: decimal fraction (0.05 = 5% APR, NOT 5.0).
  # BOTH knobs must be EXPLICITLY present in this YAML -- economics_gate.py refuses
  # to run with silent Pydantic defaults (T-01-12-01 fail-loud guard).
  alt_yield: 0.05
  # fill_loss_coarse_bound: coarse upper-bound estimate of realized fill-loss rate (APR-decimal).
  # This is a Phase-1 COARSE BOUND (A1 landmine in 01-RESEARCH.md). Phase 3 refines it with
  # the empirical LossModel + NHPP fill probability. Until Phase 3, DO NOT tune this below
  # 0.02 -- overly-loose filter passes markets that will later be discovered -EV.
  # See [[fill_loss_coarse_bound v0.5]] for full discussion.
  # coarse bound, refined in Phase 3 via empirical LossModel (PROTO-05 supersedence planned).
  fill_loss_coarse_bound: 0.02

fill_model:
  window_days: 14
  bin_duration_s: 60.0
  refit_cadence_s: 900.0
  covariate_whitelist:
    - basis_spread
    - imbalance
    - sin_settlement
    - cos_settlement
    - ewma_vol
  queue_tracker_bias_mode: pessimistic
  gof_ks_pval_threshold: 0.0
  gof_lr_ratio_threshold: null
  fit_warn_staleness_s: 1800.0
  fit_max_staleness_s: 3600.0
  bracket_width_warn_multiplier: 0.5
  min_events_per_param_ratio: 10

markets: []
