#     # reward_calibration: # OPTIONAL (LOCKED D-01) — at daily re-screen, uncomment + fill from dApp UI
#     #   e_liq_per_epoch_pendle: 273.0   # Read from Pendle dApp "LO rewards" panel
#     #   long_side_split: 0.14            # long-side fraction of E_liq
#     #   short_side_split: 0.86           # must sum to 1.0 with long_side_split
#     #   calibrated_at_utc: "2026-04-24T00:00:00+00:00"
#     #   source: dapp_ui                  # or team_statement / pendle_docs
markets: []
