; Alembic config for the boros state spine.
;
; `script_location` is relative to THIS file; tests override it to an absolute
; path via `cfg.set_main_option("script_location", ...)`.
;
; `sqlalchemy.url` is the production default; tests override with a tmp path.

[alembic]
script_location = %(here)s
sqlalchemy.url = sqlite:///state/state.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
