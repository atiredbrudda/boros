[project]
name = "boros-brain"
version = "0.0.1"
description = "Boros Reward Farming Bot — Python brain (models, backtest, decision loop)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.3",
  "structlog==25.5.0",
  "orjson>=3.10,<4",
  "python-ulid>=3.0,<4",
  "polars==1.40.1",
  "duckdb==1.5.0",
  "web3==7.15.0",
  "httpx>=0.27,<0.28",
  "pyzmq==26.2.0",
  "alembic>=1.14,<2",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "statsmodels>=0.14.6",
  "tick==0.8.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24",
  "pytest-testmon>=2",
  "ruff>=0.7",
  "mypy>=1.13",
  "hypothesis>=6",
  "pre-commit>=4",
  "types-pyyaml>=6.0.12.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boros_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
  "slow: long-running (skipped by quick pass)",
  "wave0_scaffold: tracer-bullet stubs wired once dependent plan lands",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
