  - from: brain.data.poller.markets_poller
    to: brain.data.poller.schemas
    type: reads
    notes: "MarketsResponse.model_validate_json for /markets response"

  - from: brain.data.poller.markets_poller
    to: brain.data.chain_time
    type: calls
