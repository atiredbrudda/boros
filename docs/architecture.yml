    to: brain.data.rpc_client
    type: reads
    notes: "fIndexOracle raw bytes decoded by FIndexReader in poller; scale_calibration reads the stored f_index_raw from clo_history"

  # ── DATA-08 filter + report + CLI edges (01-11 Task 3) ─────────────────────
  - from: brain.screener.filter
    to: brain.screener.metrics
    type: calls
    notes: "apply_screener_filters calls all 6 compute_* functions per market"

  - from: brain.screener.filter
    to: brain.screener.scale_calibration
    type: calls
    notes: "apply_screener_filters calls get_calibration_pairs + calibrate_scale (non-blocking)"

  - from: brain.screener.filter
    to: state.clo_history
    type: reads
    notes: "reads clo_lower_thresh/clo_upper_thresh for CLO bounds filters"

  - from: brain.screener.filter
    to: state.reward_budget_history
    type: reads
    notes: "reads e_liq_per_epoch for r_apr_potential ranking (T-01-11-03)"

  - from: brain.screener.filter
    to: config.screener
    type: depends-on-config
    notes: "reads all ScreenerConfig knobs: min_time_to_maturity_days, trades_window_days, etc."

  - from: brain.screener.report
    to: var.reports.screener_metrics
    type: writes
    notes: "write_screener_metrics_report writes shortlist + full metric tree"

  - from: brain.screener.cli
    to: brain.screener.filter
    type: calls
    notes: "main() calls apply_screener_filters for each market in config.markets"

  - from: brain.screener.cli
    to: brain.screener.report
    type: calls
    notes: "main() calls write_screener_metrics_report after filtering"

  - from: brain.screener.cli
    to: brain.manifest.writer
    type: calls
    notes: "main() calls build_run_manifest + write_manifest first (PROTO-01)"

  # ── DATA-09 economics gate edges (01-12 Task 1) ─────────────────────────────
  - from: brain.screener.economics_gate
    to: brain.config.loader
    type: calls
    notes: "load_raw_yaml() + load_config() -- raw for explicit-key check, validated for knob values"

  - from: brain.screener.economics_gate
    to: config.screener.alt_yield
    type: depends-on-config
    notes: "T-01-12-01: asserts alt_yield present as explicit YAML key; T-01-12-02: range check (0.0, 0.5)"

  - from: brain.screener.economics_gate
    to: config.screener.fill_loss_coarse_bound
    type: depends-on-config
    notes: "T-01-12-01: asserts fill_loss_coarse_bound present; T-01-12-02: range check (0.0, 0.2)"

  - from: brain.screener.economics_gate
    to: var.reports.screener_metrics
    type: reads
    notes: "reads screener_metrics.json to evaluate filter_pass=True markets for DATA-09 gate"

  - from: brain.screener.economics_gate
    to: brain.screener.kill_report
    type: calls
    notes: "calls write_kill_report() on empty shortlist before raising ProjectHalt"

  - from: brain.screener.economics_gate
    to: var.reports.economics_gate
    type: writes
    notes: "writes per-market R_apr decisions + shortlist (non-halt audit trail)"

  - from: brain.screener.kill_report
    to: docs.kill_report_template
    type: reads
    notes: "reads kill-report-template.md, renders with per-market table + knob tree"

  - from: brain.screener.kill_report
    to: docs.kill_report
    type: writes
    notes: "writes docs/kill-report-YYYYMMDD.md on ProjectHalt (T-01-12-04)"

  - from: brain.screener.cli
    to: brain.screener.economics_gate
    type: calls
    notes: "--economics-gate flag invokes run_economics_gate(); exit 1 on ProjectHalt, exit 2 on ConfigError"

  # ── DATA-10 daily re-screen edges (01-12 Task 2) ────────────────────────────
  - from: brain.screener.rescreen
    to: brain.screener.cli
    type: calls
    notes: "run_daily_rescreen invokes screener programmatically (DATA-08 stage)"

  - from: brain.screener.rescreen
    to: brain.screener.economics_gate
    type: calls
    notes: "run_daily_rescreen invokes run_economics_gate (DATA-09 stage)"

  - from: brain.screener.rescreen
    to: var.reports.rescreen_diff
    type: writes
    notes: "writes rescreen_diff.json with new_entrants + dropped + unchanged markets"

  - from: launchd.com.boros.rescreen
    to: brain.screener.rescreen
    type: calls
    notes: "CalendarInterval 03:00 UTC daily -- python -m boros_brain.screener.rescreen"

  # ── load_raw_yaml addition to config.loader (01-12) ─────────────────────────
  - from: brain.config.loader
    to: brain.config.schema
    type: reads
    notes: "load_raw_yaml() returns raw dict; load_config() calls BotConfig.model_validate -- both used by economics_gate"

  # ── Phase 2 Plan 02-01 edges ─────────────────────────────────────────────────
  - from: brain.fill_model.features
    to: parquet.market_trades
    type: reads
    notes: "DuckDB-joined feature table reads market_trades via open_analytical_conn"

  - from: brain.fill_model.features
    to: parquet.order_book_combined
    type: reads
    notes: "book_imbalance covariate joined from order_book_combined snapshots"

  - from: brain.fill_model.features
    to: parquet.order_book_raw
    type: reads
    notes: "order_book_raw available for per-tick raw size queries (joins through DuckDB views)"

  - from: brain.fill_model.features
    to: parquet.underlying_apr
    type: reads
    notes: "underlying_rate joined from underlying_apr for basis_spread = mid_rate - underlying"

  - from: brain.fill_model.features
    to: state.clo_history
    type: reads
    notes: "clo_history attached read-only via sqlite_scanner (through open_analytical_conn)"

  - from: brain.fill_model.features
    to: parquet.fill_features
    type: writes
    notes: "Hive-partitioned feature rows: market_id / side / features.parquet"

  - from: brain.fill_model.features
    to: brain.duckdb_layer.setup
    type: calls
    notes: "open_analytical_conn(sqlite_path, parquet_dir) — read-only attach"

  - from: brain.fill_model.config
    to: brain.fill_model.constants
    type: calls
    notes: "imports ALLOWED_COVARIATES + DEFAULT_COVARIATE_WHITELIST for field_validator"

  - from: brain.config.schema
    to: brain.fill_model.config
    type: calls
    notes: "BotConfig.fill_model: FillModelConfig field (Plan 02-01 attach-point)"

  - from: brain.fill_model.features
    to: config.fill_model.bin_duration_s
    type: depends-on-config
    notes: "bin width used for SQL floor() binning and output bin_duration_s column"

  - from: brain.fill_model.features
    to: config.fill_model.window_days
    type: depends-on-config
    notes: "window_days × 86400 = window length in seconds (caller computes window_start_ts)"

  - from: brain.fill_model.features
    to: config.fill_model.covariate_whitelist
    type: depends-on-config
    notes: "Plan 02-03 fitter consults covariate_whitelist to select columns from the feature table"

  # ── Phase 2 Plan 02-02 edges ───────────────────────────────────────────────
  - from: brain.fill_model.queue_tracker
    to: parquet.market_trades
    type: reads
    notes: "eventIndex-ordered tape replay — (blockTimestamp, eventIndex) sort"

  - from: brain.fill_model.queue_tracker
    to: parquet.order_book_raw
    type: reads
    notes: "hourly replay anchors — snapshot_ts sorted per (market_id, side)"

  - from: brain.fill_model.queue_tracker
    to: brain.fill_model.amm_consumption
    type: calls
    notes: "imports assert_epoch_conservation for runtime identity check; also imports AMMConsumptionIdentityError via schemas"

  - from: brain.fill_model.queue_tracker
    to: brain.fill_model.schemas
    type: calls
    notes: "ReplayResult dataclass — returned by replay_window"

  - from: brain.fill_model.queue_tracker
    to: config.fill_model.bracket_width_warn_multiplier
    type: depends-on-config
    notes: "triggers fill_model.bracket_width_warn log event when bracket exceeds multiplier * hourly_mean_queue"

  - from: brain.fill_model.queue_tracker
    to: config.fill_model.queue_tracker_bias_mode
    type: depends-on-config
    notes: "pessimistic (default) | optimistic | realized — selects which track feeds PredictInput.queue_ahead_wei"

  - from: brain.fill_model.amm_consumption
    to: parquet.order_book_raw
    type: reads
    notes: "per-tick raw size for amm_share = max(combined - raw, 0.0)"

  - from: brain.fill_model.amm_consumption
    to: parquet.order_book_combined
    type: reads
    notes: "per-tick combined (raw + AMM liquidity) size for amm_share computation"

  - from: brain.fill_model.amm_consumption
    to: brain.fill_model.schemas
    type: calls
    notes: "AMMConsumptionIdentityError exception class lives in schemas; re-exported from amm_consumption"

  # ── Phase 2: Fill Model — Plan 02-03 (fit + predict + artifact + writer) ──
  - from: brain.fill_model.fit
    to: brain.fill_model.artifact
    type: calls
    notes: "write_fit_artifact(artifact, sqlite_path=) — persist=True (default) or skip for bootstrap resamples"

  - from: brain.fill_model.fit
    to: parquet.fill_features
    type: reads
    notes: "consumes feature rows from Plan 02-01 build_features_table output"

  - from: brain.fill_model.artifact
    to: brain.state.writers.fill_model_fits
    type: calls
    notes: "insert_fit_artifact — single-writer-per-table (PROTO-02)"

  - from: brain.fill_model.artifact
    to: parquet.fill_model_artifacts
    type: writes
    notes: "parquet sidecar first (orphan-tolerant), SQLite row second"

  - from: brain.state.writers.fill_model_fits
    to: state.fill_model_fits
    type: writes
    notes: "insert_fit_artifact — upsert on PK (market_id, side, fit_window_end_ts)"

  - from: brain.state.writers.fill_model_fits
    to: state.fill_model_fits
    type: reads
    notes: "get_latest_fit — ORDER BY fit_window_end_ts DESC LIMIT 1"

  - from: brain.fill_model.predict
    to: brain.state.writers.fill_model_fits
    type: calls
    notes: "get_latest_fit — direct SQLite read on 1 Hz hot path"

  - from: brain.fill_model.predict
    to: brain.fill_model.schemas
    type: calls
    notes: "PredictInput/Output + FillModelStaleFeatureError + FillModelNoFreshFitError"

  - from: brain.fill_model.fit
    to: brain.fill_model.schemas
    type: calls
    notes: "FitArtifact construction"

  - from: brain.fill_model.fit
    to: config.fill_model.min_events_per_param_ratio
    type: depends-on-config
    notes: "_passes_health_gate: nobs/n_params < min_events_per_param_ratio → degraded"

  - from: brain.fill_model.predict
    to: config.fill_model.fit_warn_staleness_s
    type: depends-on-config
    notes: "fit_age_s > fit_warn_staleness_s → output fit_status='stale' (warning only)"

  - from: brain.fill_model.predict
    to: config.fill_model.fit_max_staleness_s
    type: depends-on-config
    notes: "fit_age_s > fit_max_staleness_s → FillModelNoFreshFitError (hard gate)"

  - from: brain.fill_model.predict
    to: config.fill_model.covariate_whitelist
    type: depends-on-config
    notes: "validates current_features keys against whitelist; NaN → FillModelStaleFeatureError"

  - from: brain.fill_model.predict
    to: brain.data.chain_time
    type: depends-on
    notes: "predict() is sync — does NOT call chain_time directly. Callers (refit_loop, DecisionEngine in Phase 4) MUST supply current_chain_ts from chain_time.now_cached(). Edge documents the data-flow dependency."
