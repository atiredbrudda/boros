  - from: brain.data.poller.markets_poller
    to: brain.state.writers.clo_history
    type: calls
    notes: "insert_clo_history() on change only — single-writer INFRA-03"

  - from: brain.state.writers.clo_history
    to: state.clo_history
    type: writes
    notes: "insert_clo_history / insert_clo_snapshot → clo_history table"

  - from: brain.data.poller.markets_poller
