  - from: brain.data.ingester.underlying_apr
    to: brain.data.ingester.base
    type: calls
    notes: "from .base import write_partitioned_parquet, IngestResult"

  - from: brain.data.ingester.settlement_md
    to: brain.data.ingester.base
