# ========================================================================
# Boros architecture manifest — machine-readable single source of truth.
# Parsed by scripts/architecture_lint.py at every commit.
# Consult BEFORE every code change (blast radius enumeration).
# Update IN THE SAME COMMIT as source changes.
# ========================================================================
version: 1
# Phase 1 seed — plans 01-01/02/03 landed these nodes. Phase 2+ extends.

nodes:
  # ── Processes ──────────────────────────────────────────────────────────
  - id: brain
    type: process
    language: python
    entrypoint: python/src/boros_brain/main.py

  - id: hands
    type: process
    language: typescript
    entrypoint: ts/src/boros_hands/main.ts

  # ── Python modules (from 01-01 / 01-02 / 01-03) ───────────────────────
  - id: brain.main
    type: module
    process: brain
    path: python/src/boros_brain/main.py
    public_functions: [build_parser, run, main]

  - id: brain.config.schema
    type: module
    process: brain
    path: python/src/boros_brain/config/schema.py
    public_functions: []   # Pydantic models only — no top-level functions

  - id: brain.config.loader
    type: module
    process: brain
    path: python/src/boros_brain/config/loader.py
    public_functions: [load_config, load_raw_yaml]

  - id: brain.state.db
    type: module
    process: brain
    path: python/src/boros_brain/state/db.py
    public_functions: [open_connection, enable_wal_mode, ensure_permissions_0600]

  - id: brain.state.writers.open_orders
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/open_orders.py
    public_functions: [insert_open_order, update_open_order_status, read_open_orders_for_market]

  - id: brain.state.writers.decisions
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/decisions.py
    public_functions: [insert_decision, read_last_r_me_pendle]

  - id: brain.state.writers.tx_receipts
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/tx_receipts.py
    public_functions: [insert_tx_receipt, read_tx_receipts_fill_count]

  - id: brain.state.writers.queue_positions
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/queue_positions.py
    public_functions: [insert_queue_position]

  - id: brain.state.writers.run_manifests
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/run_manifests.py
    public_functions: [insert_run_manifest]

  - id: brain.state.writers.epoch_rewards
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/epoch_rewards.py
    public_functions: [insert_epoch_reward, mark_claim_tx]

  - id: brain.state.writers.clo_history
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/clo_history.py
    public_functions: [insert_clo_snapshot, insert_clo_history, read_latest_clo_history, read_clo_history_latest_n]

  - id: brain.state.writers.reward_budget_history
    type: module
    process: brain
    path: python/src/boros_brain/state/writers/reward_budget_history.py
    public_functions: [insert_reward_budget_row]

  - id: brain.manifest.schema
    type: module
    process: brain
    path: python/src/boros_brain/manifest/schema.py
    public_functions: []   # Pydantic model only

  - id: brain.manifest.writer
    type: module
    process: brain
    path: python/src/boros_brain/manifest/writer.py
    public_functions: [build_run_manifest, write_manifest]

  - id: brain.logging.structlog_setup
    type: module
    process: brain
    path: python/src/boros_brain/logging/structlog_setup.py
    public_functions: [configure_logging, get_logger]

  - id: brain.logging.schema
    type: module
    process: brain
    path: python/src/boros_brain/logging/schema.py
    public_functions: []   # Pydantic model only

  - id: brain.bus.messages
    type: module
    process: brain
    path: python/src/boros_brain/bus/messages.py
    public_functions: []   # Pydantic models only

  - id: brain.bus.cmd
    type: module
    process: brain
    path: python/src/boros_brain/bus/cmd.py
    public_functions: []   # CmdBus class only

  - id: brain.bus.events
    type: module
    process: brain
    path: python/src/boros_brain/bus/events.py
    public_functions: []   # EventBus class only

  - id: brain.bus.heartbeat
    type: module
    process: brain
    path: python/src/boros_brain/bus/heartbeat.py
    public_functions: []   # HeartbeatMonitor class only

  # ── TypeScript modules (from 01-01 / 01-02 / 01-03) ───────────────────
  - id: hands.main
    type: module
    process: hands
    path: ts/src/boros_hands/main.ts
    public_functions: []

  - id: hands.config
    type: module
    process: hands
    path: ts/src/boros_hands/config.ts
    public_functions: []

  - id: hands.logger
    type: module
    process: hands
    path: ts/src/boros_hands/logger.ts
    public_functions: [configureHandsLogger, log]

  - id: hands.state.sqlite_writer
    type: module
    process: hands
    path: ts/src/boros_hands/state/sqlite_writer.ts
    public_functions: [openHandsDb, upsertOpenOrder, insertTxReceipt]

  - id: hands.bus.messages
    type: module
    process: hands
    path: ts/src/boros_hands/bus/messages.ts
    public_functions: []

  - id: hands.bus.cmd_listener
    type: module
    process: hands
    path: ts/src/boros_hands/bus/cmd_listener.ts
    public_functions: []

  - id: hands.bus.event_publisher
    type: module
    process: hands
    path: ts/src/boros_hands/bus/event_publisher.ts
    public_functions: []

  - id: hands.bus.heartbeat
    type: module
    process: hands
    path: ts/src/boros_hands/bus/heartbeat.ts
    public_functions: []

  # ── SQLite tables (8 tables from 01-02 schema) ─────────────────────────
  - id: state.open_orders
    type: storage
    path: state/state.sqlite#open_orders

  - id: state.decisions
    type: storage
    path: state/state.sqlite#decisions

  - id: state.tx_receipts
    type: storage
    path: state/state.sqlite#tx_receipts

  - id: state.queue_positions
    type: storage
    path: state/state.sqlite#queue_positions

  - id: state.run_manifests
    type: storage
    path: state/state.sqlite#run_manifests

  - id: state.epoch_rewards
    type: storage
    path: state/state.sqlite#epoch_rewards

  - id: state.clo_history
    type: storage
    path: state/state.sqlite#clo_history

  - id: state.reward_budget_history
    type: storage
    path: state/state.sqlite#reward_budget_history

  # ── Config knobs — one node per BotConfig leaf field ───────────────────
  # BotConfig top-level fields
  - id: config.mode
    type: config_knob
    pydantic_path: BotConfig.mode
    default: null   # required, no default

  - id: config.strategy_version
    type: config_knob
    pydantic_path: BotConfig.strategy_version
    default: null   # required

  - id: config.market_id
    type: config_knob
    pydantic_path: BotConfig.market_id
    default: null   # required

  - id: config.side
    type: config_knob
    pydantic_path: BotConfig.side
    default: null   # required

  - id: config.root_wallet_address
    type: config_knob
    pydantic_path: BotConfig.root_wallet_address
    default: null   # required

  - id: config.agent_wallet_address
    type: config_knob
    pydantic_path: BotConfig.agent_wallet_address
    default: null   # required

  # StrategyConfig knobs
  - id: config.strategy.voluntary_cancel_forfeits_accumulated
    type: config_knob
    pydantic_path: BotConfig.strategy.voluntary_cancel_forfeits_accumulated
    default: false

  - id: config.strategy.target_share
    type: config_knob
    pydantic_path: BotConfig.strategy.target_share
    default: 0.05

  # ExecutionConfig knobs
  - id: config.execution.cancel_latency_budget_s
    type: config_knob
    pydantic_path: BotConfig.execution.cancel_latency_budget_s
    default: 5.0

  - id: config.execution.require_success_default
    type: config_knob
    pydantic_path: BotConfig.execution.require_success_default
    default: true

  - id: config.execution.agent_wallet_gas_warn_multiples
    type: config_knob
    pydantic_path: BotConfig.execution.agent_wallet_gas_warn_multiples
    default: 50

  - id: config.execution.agent_wallet_gas_halt_multiples
    type: config_knob
    pydantic_path: BotConfig.execution.agent_wallet_gas_halt_multiples
    default: 20

  - id: config.execution.agent_wallet_gas_emergency_multiples
    type: config_knob
    pydantic_path: BotConfig.execution.agent_wallet_gas_emergency_multiples
    default: 5

  # DataConfig knobs
  - id: config.data.markets_poll_interval_s
    type: config_knob
    pydantic_path: BotConfig.data.markets_poll_interval_s
    default: 30.0

  - id: config.data.e_liq_poll_interval_s
    type: config_knob
    pydantic_path: BotConfig.data.e_liq_poll_interval_s
    default: 5.0

  - id: config.data.chain_time_cache_ttl_s
    type: config_knob
    pydantic_path: BotConfig.data.chain_time_cache_ttl_s
    default: 1.0

  - id: config.data.rpc_url_arbitrum
    type: config_knob
    pydantic_path: BotConfig.data.rpc_url_arbitrum
    default: null   # required

  - id: config.data.boros_rest_base
    type: config_knob
    pydantic_path: BotConfig.data.boros_rest_base
    default: "https://api.boros.finance/open-api/v1"

  # InfraConfig knobs
  - id: config.infra.sqlite_path
    type: config_knob
    pydantic_path: BotConfig.infra.sqlite_path
    default: "state/state.sqlite"

  - id: config.infra.logs_dir
    type: config_knob
    pydantic_path: BotConfig.infra.logs_dir
    default: "logs"

  - id: config.infra.zmq_cmd_endpoint
    type: config_knob
    pydantic_path: BotConfig.infra.zmq_cmd_endpoint
    default: "ipc:///tmp/boros.cmd"

  - id: config.infra.zmq_events_brain_endpoint
    type: config_knob
    pydantic_path: BotConfig.infra.zmq_events_brain_endpoint
    default: "ipc:///tmp/boros.events.brain"

  - id: config.infra.zmq_events_hands_endpoint
    type: config_knob
    pydantic_path: BotConfig.infra.zmq_events_hands_endpoint
    default: "ipc:///tmp/boros.events.hands"

  - id: config.infra.zmq_kill_endpoint
    type: config_knob
    pydantic_path: BotConfig.infra.zmq_kill_endpoint
    default: "ipc:///tmp/boros.cmd.kill"

  - id: config.infra.heartbeat_interval_s
    type: config_knob
    pydantic_path: BotConfig.infra.heartbeat_interval_s
    default: 5.0

  - id: config.infra.heartbeat_timeout_misses
    type: config_knob
    pydantic_path: BotConfig.infra.heartbeat_timeout_misses
    default: 3

  - id: config.infra.chain_drift_warn_s
    type: config_knob
    pydantic_path: BotConfig.infra.chain_drift_warn_s
    default: 5.0

  - id: config.infra.chain_drift_halt_s
    type: config_knob
    pydantic_path: BotConfig.infra.chain_drift_halt_s
    default: 30.0

  # ScreenerConfig knobs
  - id: config.screener.min_time_to_maturity_days
    type: config_knob
    pydantic_path: BotConfig.screener.min_time_to_maturity_days
    default: 30

  - id: config.screener.trades_window_days
    type: config_knob
    pydantic_path: BotConfig.screener.trades_window_days
    default: 60

  - id: config.screener.realized_vol_window_days
    type: config_knob
    pydantic_path: BotConfig.screener.realized_vol_window_days
    default: 14

  - id: config.screener.reversal_count_window_days
    type: config_knob
    pydantic_path: BotConfig.screener.reversal_count_window_days
    default: 3

  - id: config.screener.alt_yield
    type: config_knob
    pydantic_path: BotConfig.screener.alt_yield
    default: 0.05

  - id: config.screener.fill_loss_coarse_bound
    type: config_knob
    pydantic_path: BotConfig.screener.fill_loss_coarse_bound
    default: 0.02

  # ── External dependencies ───────────────────────────────────────────────
  - id: ext.boros_rest
    type: external
    url: "https://api.boros.finance/open-api/v1"

  - id: ext.arbitrum_rpc
    type: external
    url: "https://arb1.arbitrum.io/rpc"

  - id: ext.boros_historical_data
    type: external
    url: "https://historical-data.boros.finance"

  # ── Process supervision (01-06) ─────────────────────────────────────────
  - id: launchd.brain
    type: external
    notes: "macOS LaunchAgent com.boros.brain — KeepAlive + ThrottleInterval=30"
    path: scripts/launchd/com.boros.brain.plist

  - id: launchd.hands
    type: external
    notes: "macOS LaunchAgent com.boros.hands — KeepAlive + ThrottleInterval=30"
    path: scripts/launchd/com.boros.hands.plist

  - id: macos.keychain
    type: external
    notes: "macOS login Keychain — stores DOTENV_PRIVATE_KEY_PRODUCTION under 'boros-bot-dotenvx-key'"

  - id: scripts.boros_brain_wrapper
    type: external
    notes: "bash wrapper: reads Keychain, execs dotenvx run -- boros_brain.main"
    path: scripts/boros-brain-wrapper.sh

  - id: scripts.boros_hands_wrapper
    type: external
    notes: "bash wrapper: reads Keychain, execs dotenvx run -- pnpm start:hands"
    path: scripts/boros-hands-wrapper.sh

  - id: scripts.no_plain_keys
    type: external
    notes: "pre-commit hook: greps staged files for plaintext private keys (INFRA-12 / T-01-06-01)"
    path: scripts/no_plain_keys.py

  # ── Log redaction processor (01-06 Task 2) ─────────────────────────────
  - id: brain.logging.redaction
    type: module
    process: brain
    path: python/src/boros_brain/logging/redaction.py
    public_functions: [redact_sensitive]

  # ── INFRA-14 chain-time + shared RPC client (01-07 Task 1) ─────────────
  - id: brain.data.rpc_client
    type: module
    process: brain
    path: python/src/boros_brain/data/rpc_client.py
    public_functions: [make_arbitrum_rpc, get_latest_block_timestamp]

  - id: brain.data.chain_time
    type: module
    process: brain
    path: python/src/boros_brain/data/chain_time.py
    public_functions: [install, now_cached, startup_check, drift_monitor_tick]

  - id: scripts.no_time_time_lint
    type: external
    notes: "pre-commit hook: rejects time.time() in brain/{decision,data,screener}/ (INFRA-14 / PITFALLS §C7)"
    path: scripts/no_time_time_lint.py

  # ── DATA-06 /markets REST client + poller (01-09) ──────────────────────
  - id: brain.data.rest_client
    type: module
    process: brain
    path: python/src/boros_brain/data/rest_client.py
    public_functions: [make_boros_rest_client]   # BorosApiError is a class (not a fn)

  - id: brain.data.poller.schemas
    type: module
    process: brain
    path: python/src/boros_brain/data/poller/schemas.py
    public_functions: []   # Pydantic models only — MarketsResponse, Market, MarketConfig etc.

  - id: brain.data.poller.markets_poller
    type: module
    process: brain
    path: python/src/boros_brain/data/poller/markets_poller.py
    public_functions: [run_markets_poller]   # MarketsPoller is a class (not a fn)

  - id: brain.data.poller.e_liq_poller
    type: module
    process: brain
    path: python/src/boros_brain/data/poller/e_liq_poller.py
    public_functions: []   # ELiqPoller is a class (not a fn)

  # ── DATA-07 fIndexOracle reader (01-09) ─────────────────────────────────
  - id: brain.data.findex_reader
    type: module
    process: brain
    path: python/src/boros_brain/data/findex_reader.py
    public_functions: [decode_findex_bytes, fIndex_display]   # FIndexReader/FIndexDecodeError are classes; FINDEX_ABI/KNOWN_ORACLES are constants

  # ── INFRA-04 DuckDB analytical layer (01-07 Task 2) ────────────────────
  - id: brain.duckdb_layer.setup
    type: module
    process: brain
    path: python/src/boros_brain/duckdb_layer/setup.py
    public_functions: [open_analytical_conn, attach_sqlite_readonly, register_parquet_views]

  - id: brain.duckdb_layer.views_sql
    type: storage
    path: python/src/boros_brain/duckdb_layer/views.sql

  # ── DATA-01..04 NDJSON → parquet ingesters (01-08) ─────────────────────
  - id: brain.data.ingester.base
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/base.py
    public_functions: [write_partitioned_parquet]   # IngesterSchemaViolation + IngestResult are classes

  - id: brain.data.ingester.schemas
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/schemas.py
    public_functions: []   # Schema constants only — MARKET_TRADES_SCHEMA etc.

  - id: brain.data.ingester.market_trades
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/market_trades.py
    public_functions: [ingest_market_trades]

  - id: brain.data.ingester.order_book
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/order_book.py
    public_functions: [ingest_order_book_raw, ingest_order_book_combined, assert_amm_conservation]

  - id: brain.data.ingester.exceptions
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/exceptions.py
    public_functions: []   # AMMConservationError is a class (not a fn)

  - id: brain.data.ingester.underlying_apr
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/underlying_apr.py
    public_functions: [ingest_underlying_apr]

  - id: brain.data.ingester.settlement_md
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/settlement_md.py
    public_functions: [ingest_settlement_md]

  - id: brain.data.ingester.cli
    type: module
    process: brain
    path: python/src/boros_brain/data/ingester/cli.py
    public_functions: [main]
    config_knobs:
      - name: --raw-src
        type: Path
        optional: true
        applies_to: "--kind order_book_combined"
        notes: "Path to corresponding order_book_raw NDJSON; activates DATA-05 AMM conservation gate when provided"

  # ── Parquet storage nodes (written by 01-08 ingesters) ─────────────────
  - id: parquet.market_trades
    type: storage
    path: data/parquet/market_trades/**/*.parquet
    notes: "Hive-partitioned: market_id / year_month. Written by ingest_market_trades."

  - id: parquet.order_book_raw
    type: storage
    path: data/parquet/order_book_raw/**/*.parquet
    notes: "Hive-partitioned: market_id / snapshot_ts. Written by ingest_order_book_raw."

  - id: parquet.order_book_combined
    type: storage
    path: data/parquet/order_book_combined/**/*.parquet
    notes: "Hive-partitioned: market_id / tick_size / snapshot_ts. Written by ingest_order_book_combined."

  - id: parquet.underlying_apr
    type: storage
    path: data/parquet/underlying_apr/**/*.parquet
    notes: "Hive-partitioned: exchange / year_month. Written by ingest_underlying_apr."

  - id: parquet.settlement
    type: storage
    path: data/parquet/settlement/**/*.parquet
    notes: "Hive-partitioned: market_id / year_month. Written by ingest_settlement_md."

  - id: parquet.market_data
    type: storage
    path: data/parquet/market_data/**/*.parquet
    notes: "Hive-partitioned: market_id / year_month. Written by ingest_settlement_md."

  # ── DATA-08 screener metrics (01-11 Task 1) ────────────────────────────────
  - id: brain.screener.metrics
    type: module
    process: brain
    path: python/src/boros_brain/screener/metrics.py
    public_functions: [compute_inter_arrival_cv, compute_realized_vol, compute_reversal_count, compute_depth_at_clo_edge, compute_outside_range_wall_ratio, compute_days_to_maturity]

  # ── DATA-08 SCALE calibration (01-11 Task 2) ───────────────────────────────
  - id: brain.screener.scale_calibration
    type: module
    process: brain
    path: python/src/boros_brain/screener/scale_calibration.py
    public_functions: [calibrate_scale, get_calibration_pairs]

  # ── DATA-08 screener filter + report + CLI (01-11 Task 3) ─────────────────
  - id: brain.screener.filter
    type: module
    process: brain
    path: python/src/boros_brain/screener/filter.py
    public_functions: [apply_screener_filters]

  - id: brain.screener.report
    type: module
    process: brain
    path: python/src/boros_brain/screener/report.py
    public_functions: [write_screener_metrics_report]

  - id: brain.screener.cli
    type: module
    process: brain
    path: python/src/boros_brain/screener/cli.py
    public_functions: [main, run_screener]

  # ── DATA-09 economics gate + kill-report (01-12 Task 1) ───────────────────────
  - id: brain.screener.economics_gate
    type: module
    process: brain
    path: python/src/boros_brain/screener/economics_gate.py
    public_functions: [compute_r_apr_on_collateral_pendle, run_economics_gate, run_screener]

  - id: brain.screener.kill_report
    type: module
    process: brain
    path: python/src/boros_brain/screener/kill_report.py
    public_functions: [write_kill_report]

  # ── DATA-10 daily re-screen scheduler (01-12 Task 2) ─────────────────────────
  - id: brain.screener.rescreen
    type: module
    process: brain
    path: python/src/boros_brain/screener/rescreen.py
    public_functions: [run_daily_rescreen]

  - id: launchd.com.boros.rescreen
    type: external
    notes: "macOS LaunchAgent com.boros.rescreen -- CalendarInterval daily 03:00 UTC, KeepAlive=false"
    path: scripts/launchd/com.boros.rescreen.plist

  # ── screener report output ──────────────────────────────────────────────────
  - id: var.reports.screener_metrics
    type: storage
    path: var/reports/screener_metrics.json
    notes: "Screener output: full metric tree + shortlist <= 4 markets (DATA-08)"

  - id: var.reports.economics_gate
    type: storage
    path: var/reports/economics_gate.json
    notes: "DATA-09 economics gate per-market decisions + shortlist (01-12)"

  - id: var.reports.rescreen_diff
    type: storage
    path: var/reports/rescreen_diff.json
    notes: "DATA-10 daily diff: new_entrants + dropped + unchanged markets (01-12)"

  - id: docs.kill_report
    type: storage
    path: docs/kill-report-YYYYMMDD.md
    notes: "DATA-09 halt artifact: per-market R_apr table + knob tree + halt semantics (01-12)"

  - id: docs.kill_report_template
    type: storage
    path: docs/kill-report-template.md
    notes: "Template used by kill_report.py to render docs/kill-report-YYYYMMDD.md"

  # ── Phase 2: Fill Model — Plan 02-01 (features + config) ────────────────────
  - id: brain.fill_model.constants
    type: module
    process: brain
    path: python/src/boros_brain/fill_model/constants.py
    public_functions: []   # Constants-only module: ALLOWED_COVARIATES + DEFAULT_*

  - id: brain.fill_model.config
    type: module
    process: brain
    path: python/src/boros_brain/fill_model/config.py
    public_functions: []   # FillModelConfig is a Pydantic class, not a function

  - id: brain.fill_model.features
    type: module
