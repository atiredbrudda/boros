  - from: brain.data.findex_reader
    to: brain.data.rpc_client
    type: calls
    notes: "make_arbitrum_rpc shared AsyncWeb3 — lazy-created per market in poller"

  - from: brain.data.findex_reader
    to: ext.arbitrum_rpc
    type: calls
    notes: "eth_call getLatestFIndex() — bytes32 payload decode"

  # ── DATA-01..04 ingester edges (01-08) ──────────────────────────────────
